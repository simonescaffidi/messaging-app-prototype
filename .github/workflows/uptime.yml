# Monitor esterno: se il servizio non risponde il workflow fallisce e invia una mail di alert via API Brevo
# a info@simonescaffidi.it (secret GitHub BREVO_API_KEY), oltre alla notifica di GitHub al proprietario del repo.
name: Monitor disponibilita
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
    inputs:
      simula_errore:
        description: 'Simula un errore per provare la notifica'
        type: boolean
        default: false
jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Controllo /health, sito e webapp
        env:
          BASE: https://messaging-app-prototype-production-ecb3.up.railway.app
          SIMULA: ${{ inputs.simula_errore }}
        run: |
          set -e
          if [ "$SIMULA" = "true" ]; then echo "::error::[ALERT] securmy - errore simulato per prova notifica"; exit 1; fi
          for p in /health / /app/; do
            for i in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE$p" || echo 000)
              [ "$code" = "200" ] && break
              sleep 20
            done
            echo "$p -> $code"
            if [ "$code" != "200" ]; then echo "::error::[ALERT] securmy - $p risponde $code"; exit 1; fi
          done
      - name: Mail di alert su fallimento
        if: failure()
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          [ -z "$BREVO_API_KEY" ] && { echo "::error::BREVO_API_KEY assente: mail di alert non inviata"; exit 0; }
          curl -s -X POST https://api.brevo.com/v3/smtp/email -H "api-key: $BREVO_API_KEY" -H 'Content-Type: application/json' \
            -d "{\"sender\":{\"email\":\"info@simonescaffidi.it\",\"name\":\"Monitor\"},\"to\":[{\"email\":\"info@simonescaffidi.it\"}],\"subject\":\"[ALERT] securmy – monitor fallito\",\"textContent\":\"Il monitor di disponibilita di Securmy (messaging-app-prototype) ha rilevato un problema. Dettagli: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
